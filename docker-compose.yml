version: '3.8'

services:
  # MongoDB Primary Database Service
  mongodb:
    image: mongo:7.0
    container_name: ai_decoder_mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: ai_decoder
    volumes:
      - mongodb_data:/data/db

  # Mongo Express - Web GUI for visual database management
  mongo-express:
    image: mongo-express:latest
    container_name: ai_decoder_mongo_express
    restart: always
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/ai_decoder?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
    depends_on:
      - mongodb

  # AI DECODER Backend Engine
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai_decoder_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/ai_decoder?authSource=admin
      JWT_SECRET: super_secret_ai_decoder_jwt_token_key_2026
      # OPENAI_API_KEY:
      # GEMINI_API_KEY:
    depends_on:
      - mongodb

volumes:
  mongodb_data:
    driver: local
